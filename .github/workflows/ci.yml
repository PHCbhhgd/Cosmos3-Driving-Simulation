name: CPU tooling checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.2 numpy==1.26.4
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_repo.py
      - run: python -m compileall -q scripts tests
      - name: Bash syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
